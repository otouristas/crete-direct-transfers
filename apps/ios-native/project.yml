name: TransferAround
options:
  bundleIdPrefix: com.transferaround
  deploymentTarget:
    iOS: '17.0'
  generateEmptyDirectories: false
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.4
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: S768Y6EZW8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 5
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  TransferAround:
    type: application
    platform: iOS
    sources: [Shared, Traveler]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transferaround.rider
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Traveler/Info.plist
        CODE_SIGN_ENTITLEMENTS: Traveler/TransferAround.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TransferAroundDriver:
    type: application
    platform: iOS
    sources: [Shared, Driver]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transferaround.driver
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Driver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Driver/TransferAroundDriver.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DRIVER'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TransferAroundTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TransferAround
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TransferAround:
    build:
      targets:
        TransferAround: all
    test:
      targets: [TransferAroundTests]
  TransferAroundDriver:
    build:
      targets:
        TransferAroundDriver: all
